{{ define "main" }}
<article class="single-page">
  <div class="page-heading"><h1>{{ .Title }}<span class="name-period">.</span></h1><p>Software I’ve built and open-source projects I contribute to.</p></div>
  <h2 class="sr-only">Public software</h2>
  <div class="projects-grid">{{ range hugo.Data.projects }}{{ partial "project.html" . }}{{ end }}</div>
  <div class="page-postscript"><p>You can find more of my code on GitHub.</p><a class="text-link" href="{{ .Site.Params.github }}">GitHub profile<svg class="icon" aria-hidden="true"><use href="#icon-external"/></svg></a></div>
</article>
{{ end }}
