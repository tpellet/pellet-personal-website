{{ define "main" }}
<article class="single-page resume-page">
  <div class="page-heading"><h1>{{ .Title }}<span class="name-period">.</span></h1><div class="page-description">{{ .Content }}</div></div>
  <div class="resume-actions"><a class="btn btn-primary" href="{{ .Site.Params.resume | relURL }}" download>Download PDF<svg class="icon" aria-hidden="true"><use href="#icon-download"/></svg></a><a class="text-link" href="{{ .Site.Params.resume | relURL }}" target="_blank" rel="noopener">Open PDF in a new tab<svg class="icon" aria-hidden="true"><use href="#icon-external"/></svg></a></div>
  <object class="pdf-viewer" data="{{ .Site.Params.resume | relURL }}" type="application/pdf" aria-label="Thomas Pellet’s résumé"><p>Your browser cannot display this PDF. <a href="{{ .Site.Params.resume | relURL }}">Open the résumé</a> to read it.</p></object>
</article>
{{ end }}
