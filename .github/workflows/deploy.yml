name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install browser checks
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit

      - name: Check browser and test types
        run: npm run typecheck

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Check GitHub Pages output in browsers
        env:
          E2E_BASE_URL: http://127.0.0.1:4173${{ steps.pages.outputs.base_path }}/
        run: npm run test:e2e

      - name: Build and check root-domain output
        env:
          E2E_BASE_URL: http://127.0.0.1:4174/
          E2E_SITE_DIR: ${{ runner.temp }}/site-root
        run: |
          hugo --gc --minify --baseURL "https://portfolio.example/" --destination "$E2E_SITE_DIR"
          npm run test:e2e

      - name: Preserve failed browser checks
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
